apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-mongodb-init
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: mongodb-init
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: sausage-store
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: mongodb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongodb-init
          image: mongo:7.0
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              ROOT_USER="{{ .Values.mongodb.env.MONGO_INITDB_ROOT_USERNAME }}"
              ROOT_PASS="{{ .Values.mongodb.env.MONGO_INITDB_ROOT_PASSWORD }}"
              APP_USER="{{ .Values.mongodb.init.username }}"
              APP_PASS="{{ .Values.mongodb.init.password }}"
              APP_DB="{{ .Values.mongodb.init.database }}"
              MONGO_HOST="mongodb"
              MONGO_PORT="{{ .Values.mongodb.containerPort }}"

              echo "Waiting for MongoDB..."
              until mongosh "mongodb://${ROOT_USER}:${ROOT_PASS}@${MONGO_HOST}:${MONGO_PORT}/admin" \
                --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do
                echo "MongoDB is not ready yet, retrying..."
                sleep 5
              done
              echo "MongoDB is ready"

              mongosh "mongodb://${ROOT_USER}:${ROOT_PASS}@${MONGO_HOST}:${MONGO_PORT}/admin" --quiet <<EOF
              const targetDb = db.getSiblingDB("${APP_DB}");
              const existing = targetDb.getUser("${APP_USER}");
              if (existing) {
                print("User ${APP_USER} already exists in ${APP_DB}");
              } else {
                targetDb.createUser({
                  user: "${APP_USER}",
                  pwd: "${APP_PASS}",
                  roles: [ { role: "readWrite", db: "${APP_DB}" } ]
                });
                print("User ${APP_USER} created in ${APP_DB}");
              }
              EOF
